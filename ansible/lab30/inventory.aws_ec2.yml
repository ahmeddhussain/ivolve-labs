plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:service: db
  instance-state-name: running
keyed_groups:
  - key: tags.service
    prefix: tag
hostnames:
  - ip-address
compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'/home/ahmed/.ssh/ivolve-aws.pem'"
